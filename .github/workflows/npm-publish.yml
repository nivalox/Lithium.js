name: Publish to npm

# Runs when you publish a GitHub Release (not on every push to main), plus a
# manual "Run workflow" button. That way a bad commit on main never gets
# auto-published just for existing — you decide what becomes a release.
#
# One-time setup this workflow can't do for you:
#   1. Get an npm "Automation" token at https://www.npmjs.com/settings/<you>/tokens
#      (Automation tokens work in CI even with 2FA enabled on your account).
#   2. Add it as a repo secret named NPM_TOKEN:
#      Settings -> Secrets and variables -> Actions -> New repository secret.
#
# To cut a release:
#   1. Bump "version" in package.json (e.g. 1.1.0 -> 1.1.1) and commit it.
#   2. git tag v1.1.1 && git push origin v1.1.1
#   3. On GitHub: Releases -> Draft a new release -> pick the v1.1.1 tag -> Publish.
#   This workflow then checks the tag matches package.json's version and publishes.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets npm attach build provenance to the published package
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Check package.json version matches the release tag
        if: github.event_name == 'release'
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG="${{ github.event.release.tag_name }}"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "package.json version is $PKG_VERSION but the release tag is $TAG - bump package.json and re-tag before publishing."
            exit 1
          fi

      - name: Publish
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          
